<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاستعلام عن النتيجة</title>
    <!-- مكتبة قراءة ملفات الإكسل -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-right: 4px solid #007bff;
            border-radius: 6px;
            white-space: pre-line;
            font-family: monospace;
            font-size: 15px;
            display: none;
        }
        .status-msg { text-align: center; margin-top: 10px; font-weight: bold; }
        .error { color: red; }
        .loading { color: #d97706; }
    </style>
</head>
<body>

<div class="container">
    <h2>موقع الاستعلام عن النتيجة</h2>

    <div class="input-group">
        <label for="searchInput">ادخل رقم الجلوس أو اسم الطالب:</label>
        <input type="text" id="searchInput" placeholder="اكتب هنا للبحث...">
    </div>

    <button onclick="searchStudent()">عرض النتيجة</button>

    <div id="statusMsg" class="status-msg loading">جاري تحميل قاعدة البيانات...</div>
    <div id="resultBox" class="result-box"></div>
</div>

<script>
    let studentsData = [];

    // جلب ملف الإكسل تلقائياً من السيرفر عند فتح الصفحة
    window.onload = function() {
        const statusMsg = document.getElementById('statusMsg');
        
        // جلب الملف data.xlsx المرفوع مع الصفحة
        fetch('data.xlsx')
            .then(response => {
                if (!response.ok) throw new Error("لم يتم العثور على ملف البيانات data.xlsx");
                return response.arrayBuffer();
            })
            .then(buffer => {
                const data = new Uint8Array(buffer);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // تحويل البيانات إلى JSON
                studentsData = XLSX.utils.sheet_to_json(worksheet);
                
                statusMsg.style.display = 'none'; // إخفاء رسالة التحميل بعد الجلب
            })
            .catch(err => {
                statusMsg.className = 'status-msg error';
                statusMsg.innerText = 'عفواً، تعذر تحميل قاعدة البيانات!';
                console.error(err);
            });
    };

    // دالة البحث
    function searchStudent() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const statusMsg = document.getElementById('statusMsg');
        const resultDiv = document.getElementById('resultBox');

        resultDiv.style.display = 'none';
        statusMsg.style.display = 'none';

        if (studentsData.length === 0) {
            statusMsg.className = 'status-msg error';
            statusMsg.innerText = 'البيانات لم تجهز بعد أو تعذر جلبها!';
            statusMsg.style.display = 'block';
            return;
        }

        if (!query) {
            statusMsg.className = 'status-msg error';
            statusMsg.innerText = 'يرجى إدخال رقم الجلوس أو الاسم!';
            statusMsg.style.display = 'block';
            return;
        }

        // البحث
        const student = studentsData.find(s => {
            const seatingNo = s.seating_no ? String(s.seating_no).trim() : '';
            const arabicName = s.arabic_name ? String(s.arabic_name).trim().toLowerCase() : '';
            return seatingNo === query || arabicName.includes(query);
        });

        if (student) {
            let outputText = `seating_no: ${student.seating_no}\n\n`;
            outputText += `▪️ arabic_name: ${student.arabic_name}\n`;
            outputText += `▪️ total_degree: ${student.total_degree}\n\n`;
            outputText += `▪️ student_case_desc: ${student.student_case_desc}`;

            resultDiv.innerText = outputText;
            resultDiv.style.display = 'block';
        } else {
            statusMsg.className = 'status-msg error';
            statusMsg.innerText = 'لم يتم العثور على نتائج!';
            statusMsg.style.display = 'block';
        }
    }
</script>

</body>
</html>
